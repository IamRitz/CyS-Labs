name: Lab 1 - Juice Shop Smoke Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Juice Shop image
        run: docker pull bkimminich/juice-shop:v20.2.0

      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 127.0.0.1:3000:3000 \
            bkimminich/juice-shop:v20.2.0

      - name: Wait for Juice Shop
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail \
              http://localhost:3000/rest/admin/application-version \
              >/dev/null; then
              echo "Juice Shop is healthy."
              exit 0
            fi

            echo "Waiting for Juice Shop... attempt $i/30"
            sleep 2
          done

          echo "Juice Shop did not become healthy within 60 seconds."
          docker logs juice-shop
          exit 1

      - name: Smoke test homepage
        run: |
          curl --verbose --fail \
            http://localhost:3000/ \
            2>&1
